<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Lumen: an original orb for the home page's model showcase, drawn in the lit-sphere style of the planets on this site. -->
  <defs>
    <radialGradient id="lu-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#e3f1ff" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#e3f1ff" stop-opacity="0.15"/>
      <stop offset="0.93" stop-color="#d6ffe9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e3f1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lu-body" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#f0fff7"/>
      <stop offset="0.28" stop-color="#9aeec3"/>
      <stop offset="0.6" stop-color="#27bd83"/>
      <stop offset="0.88" stop-color="#0c6f4a"/>
      <stop offset="1" stop-color="#05281b"/>
    </radialGradient>
    <radialGradient id="lu-night" cx="78%" cy="80%" r="70%">
      <stop offset="0.35" stop-color="#04170f" stop-opacity="0"/>
      <stop offset="1" stop-color="#04170f" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="lu-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.9" stop-color="#d6ffe9" stop-opacity="0"/>
      <stop offset="0.985" stop-color="#d6ffe9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d6ffe9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lu-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lu-disc"><circle cx="400" cy="400" r="300"/></clipPath>
    <filter id="lu-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <circle cx="400" cy="400" r="392" fill="url(#lu-halo)"/>
  <circle cx="400" cy="400" r="300" fill="url(#lu-body)"/>
  <g clip-path="url(#lu-disc)">
    <g filter="url(#lu-soft)" opacity="0.55">
      <ellipse cx="330" cy="470" rx="210" ry="34" fill="#f2fff8" transform="rotate(-8 330 470)"/>
      <ellipse cx="500" cy="330" rx="150" ry="24" fill="#f2fff8" transform="rotate(-12 500 330)"/>
    </g>
    <circle cx="400" cy="400" r="226" fill="none" stroke="#f2fff8" stroke-opacity="0.22" stroke-width="3"/>
  </g>
  <circle cx="400" cy="400" r="300" fill="url(#lu-night)"/>
  <circle cx="400" cy="400" r="300" fill="url(#lu-rim)"/>
  <ellipse cx="318" cy="288" rx="88" ry="56" fill="url(#lu-gloss)" transform="rotate(-28 318 288)"/>
</svg>
