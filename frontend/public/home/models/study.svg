<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Study: an original orb for the home page's model showcase, drawn in the lit-sphere style of the planets on this site. -->
  <defs>
    <radialGradient id="st-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#e3f1ff" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#e3f1ff" stop-opacity="0.15"/>
      <stop offset="0.93" stop-color="#e0e5ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e3f1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st-body" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#eceeff"/>
      <stop offset="0.28" stop-color="#a4b0ff"/>
      <stop offset="0.6" stop-color="#5d6ef2"/>
      <stop offset="0.88" stop-color="#2b3693"/>
      <stop offset="1" stop-color="#0e1342"/>
    </radialGradient>
    <radialGradient id="st-night" cx="78%" cy="80%" r="70%">
      <stop offset="0.35" stop-color="#070a26" stop-opacity="0"/>
      <stop offset="1" stop-color="#070a26" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="st-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.9" stop-color="#e0e5ff" stop-opacity="0"/>
      <stop offset="0.985" stop-color="#e0e5ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e0e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="st-disc"><circle cx="400" cy="400" r="300"/></clipPath>
    <filter id="st-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="st-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#d9deff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="400" r="392" fill="url(#st-halo)"/>
  <circle cx="400" cy="400" r="300" fill="url(#st-body)"/>
  <g clip-path="url(#st-disc)">
    <ellipse cx="400" cy="500" rx="190" ry="22" fill="#0b1040" fill-opacity="0.34" filter="url(#st-soft)"/>
    <path d="M400 372 C352 340 292 336 238 352 L238 484 C292 468 352 472 400 504 Z" fill="url(#st-page)"/>
    <path d="M400 372 C448 340 508 336 562 352 L562 484 C508 468 448 472 400 504 Z" fill="url(#st-page)" fill-opacity="0.94"/>
    <path d="M400 372 L400 504" stroke="#8d99ee" stroke-width="3" stroke-opacity="0.7"/>
    <g stroke="#7f8cea" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M270 388 C312 378 352 384 378 400"/><path d="M270 416 C312 406 352 412 378 428"/><path d="M270 444 C312 434 352 440 378 456"/>
      <path d="M430 400 C456 384 496 378 530 388"/><path d="M430 428 C456 412 496 406 530 416"/>
    </g>
    <circle cx="500" cy="452" r="13" fill="none" stroke="#7f8cea" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M500 439 L500 465 M487 452 L513 452" stroke="#7f8cea" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="400" cy="400" r="300" fill="url(#st-night)"/>
  <circle cx="400" cy="400" r="300" fill="url(#st-rim)"/>
  <ellipse cx="318" cy="288" rx="88" ry="56" fill="url(#st-gloss)" transform="rotate(-28 318 288)"/>
</svg>
