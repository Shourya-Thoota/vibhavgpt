<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Nova: an original orb for the home page's model showcase, drawn in the lit-sphere style of the planets on this site. -->
  <defs>
    <radialGradient id="no-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#e3f1ff" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#e3f1ff" stop-opacity="0.15"/>
      <stop offset="0.93" stop-color="#fff0b0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e3f1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="no-body" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="0.28" stop-color="#fadf72"/>
      <stop offset="0.6" stop-color="#e2ac22"/>
      <stop offset="0.88" stop-color="#8c5f0a"/>
      <stop offset="1" stop-color="#391f02"/>
    </radialGradient>
    <radialGradient id="no-night" cx="78%" cy="80%" r="70%">
      <stop offset="0.35" stop-color="#170c01" stop-opacity="0"/>
      <stop offset="1" stop-color="#170c01" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="no-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.9" stop-color="#fff0b0" stop-opacity="0"/>
      <stop offset="0.985" stop-color="#fff0b0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="no-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="no-disc"><circle cx="400" cy="400" r="300"/></clipPath>
    <filter id="no-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="no-bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.24" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff8dc" stop-opacity="0.2"/>
      <stop offset="0.36" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7a4a08" stop-opacity="0.2"/>
      <stop offset="0.57" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff2c4" stop-opacity="0.16"/>
      <stop offset="0.78" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="400" r="392" fill="url(#no-halo)"/>
  <circle cx="400" cy="400" r="300" fill="url(#no-body)"/>
  <g clip-path="url(#no-disc)">
    <rect x="100" y="100" width="600" height="600" fill="url(#no-bands)" transform="rotate(-9 400 400)"/>
    <path d="M520 300 L530 330 L560 340 L530 350 L520 380 L510 350 L480 340 L510 330 Z" fill="#fffbe6" fill-opacity="0.85"/>
  </g>
  <circle cx="400" cy="400" r="300" fill="url(#no-night)"/>
  <circle cx="400" cy="400" r="300" fill="url(#no-rim)"/>
  <ellipse cx="318" cy="288" rx="88" ry="56" fill="url(#no-gloss)" transform="rotate(-28 318 288)"/>
</svg>
