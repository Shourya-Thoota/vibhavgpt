<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Zenith: an original orb for the home page's model showcase, drawn in the lit-sphere style of the planets on this site. -->
  <defs>
    <radialGradient id="ze-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#e3f1ff" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#e3f1ff" stop-opacity="0.15"/>
      <stop offset="0.93" stop-color="#e6e0ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e3f1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ze-body" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#f3f0ff"/>
      <stop offset="0.28" stop-color="#c3b8ff"/>
      <stop offset="0.6" stop-color="#7d6bf0"/>
      <stop offset="0.88" stop-color="#3b2a8c"/>
      <stop offset="1" stop-color="#130d3a"/>
    </radialGradient>
    <radialGradient id="ze-night" cx="78%" cy="80%" r="70%">
      <stop offset="0.35" stop-color="#07051a" stop-opacity="0"/>
      <stop offset="1" stop-color="#07051a" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="ze-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.9" stop-color="#e6e0ff" stop-opacity="0"/>
      <stop offset="0.985" stop-color="#e6e0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e6e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ze-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ze-disc"><circle cx="400" cy="400" r="300"/></clipPath>
    <filter id="ze-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="ze-front"><rect x="0" y="420" width="800" height="400"/></clipPath>
    <linearGradient id="ze-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1eeff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#f1eeff" stop-opacity="0.8"/>
      <stop offset="0.82" stop-color="#ddd6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ddd6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="400" r="392" fill="url(#ze-halo)"/>
  <g transform="rotate(-16 400 420)"><ellipse cx="400" cy="420" rx="384" ry="86" fill="none" stroke="url(#ze-ring)" stroke-width="9" stroke-opacity="0.7"/></g>
  <circle cx="400" cy="400" r="300" fill="url(#ze-body)"/>
  <g clip-path="url(#ze-disc)">
    <g filter="url(#ze-soft)" opacity="0.5">
      <ellipse cx="400" cy="560" rx="260" ry="40" fill="#f7f5ff" transform="rotate(-8 400 560)"/>
    </g>
  </g>
  <circle cx="400" cy="400" r="300" fill="url(#ze-night)"/>
  <circle cx="400" cy="400" r="300" fill="url(#ze-rim)"/>
  <ellipse cx="318" cy="288" rx="88" ry="56" fill="url(#ze-gloss)" transform="rotate(-28 318 288)"/>
  <g transform="rotate(-16 400 420)"><g clip-path="url(#ze-front)"><ellipse cx="400" cy="420" rx="384" ry="86" fill="none" stroke="url(#ze-ring)" stroke-width="12"/></g></g>
</svg>
